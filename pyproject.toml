[project]
name = "jamlib"
version = "4.2.2a3"
description = "A modular authentication and authorization framework for Python."
authors = [
    {name = "Makridenko Adrian",email = "adrianmakridenko@duck.com"},
    {name = "Ksenia Travnikova",email = "kseniatravnikova@duck.com"}
]
license = {text = "Apache-2.0"}
readme = {file = "README.md", content-type = "text/markdown"}
keywords = [
    "Authentication",
    "Authorization",
    "Backend",
    "JOSE",
    "PASETO",
    "SAML",
    "Sessions",
    "OTP",
    "TOTP",
    "OAuth2",
    "Litestar",
    "FastAPI",
    "Starlette",
    "Flask",
    "Django",
    "Django REST Framework",
    "DRF",
]
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.1",
]

classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Typing :: Typed",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Framework :: Django",
]

[project.urls]
Homepage = "https://jam.makridenko.ru"
Repository = "https://github.com/mkrdnk/jam"
Issues = "https://github.com/mkrdnk/jam/issues"
Changelog = "https://github.com/mkrdnk/jam/blob/master/CHANGELOG.md"


[project.scripts]
jam = "jam.cli:cli"

[project.optional-dependencies]
cli=["click>=8.5.0"]
redis=["redis>=8.1.0"]
json=["tinydb>=4.9.0"]
oauth2=["httpx>=0.28.1"]
yaml=["pyyaml>=6.0.3"]
toml=["toml>=0.10.2"]
litestar=["litestar>=2.24.0"]
starlette=["starlette>=1.6.0"]
fastapi=["fastapi>=0.141.1"]
flask=["flask>=3.1.2"]
django=["django>=5.2"]
drf=[
    "django>=5.2",
    "djangorestframework>=3.18.1",
]
dmr=[
    "django>=5.2; python_version >= '3.11'",
    "django-modern-rest>=0.15.0; python_version >= '3.11'",
]

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jam*"]

[dependency-groups]
dev = [
    "click>=8.5.0",
    "fakeredis>=2.38.0",
    "icecream>=2.2.0",
    "pre-commit>=4.6.2",
    "pyrefly>=0.56.0,<0.57",
    "ruff>=0.16.8",
    "unicecream>=0.2.1",
    "uvicorn>=0.53.0",
]
tests = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.12.0",
    "coverage>=7.16.1"
]


[tool.ruff]
target-version = "py310"
line-length = 80
exclude = ["*__init__.py", "tests/", "*exceptions/", "env", ".env", ".env.example", "migrations/", ".venv/", "docs/"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "D", "I"]
ignore = ["UP009", "D100", "UP007"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["jam"]
split-on-trailing-comma = true
force-wrap-aliases = true
force-sort-within-sections = true
lines-after-imports = 2
lines-between-types = 1

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest]
python_files = ["test*.py"]
addopts = ["--capture=no"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["jam"]

[tool.coverage.report]
fail_under = 76
show_missing = true
skip_covered = true

[tool.unicecream]
exclude = ["__devtools/"]

[tool.pyrefly]
python_version = "3.10"
project_includes = ["src/jam/**/*.py"]
project_excludes = [
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "tests/",
    "docs/",
]
