name: Run test

on:
  push:
    branches:
      - "master"
  release:
    types: [published]
  pull_request:

jobs:
  run-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --group tests --all-extras
      - name: Run tests
        run: uv run pytest -x

  dmr-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dmr-version: "minimum"
            dmr-spec: "==0.15.0"
          - dmr-version: "latest"
            dmr-spec: ">=0.15.0"
    name: DMR ${{ matrix.dmr-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --python 3.11 --extra dmr --group tests
          uv pip install --upgrade "django-modern-rest${{ matrix.dmr-spec }}"
      - name: Run DMR integration tests
        run: uv run pytest -x tests/extensions/test_django_dmr.py
