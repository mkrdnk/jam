name: CI

on:
  pull_request:
  push:
    branches:
      - "master"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py3.10
      - name: Install dependencies
        run: uv sync --frozen --group dev --group tests --all-extras
      - name: Check lint and formatting
        run: |
          uv run ruff check src/
          uv run ruff format --check src/
      - name: Check types
        run: uv run pyrefly check
      - name: Check lockfile
        run: uv lock --check
      - name: Check generated changes
        run: git diff --exit-code

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py${{ matrix.python-version }}
      - name: Record runtime versions
        run: |
          {
            echo "### Runtime"
            echo
            echo '```text'
            python --version
            uv --version
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        run: uv sync --frozen --group tests --all-extras
      - name: Run tests
        run: uv run pytest -x

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py3.12
      - name: Install dependencies
        run: uv sync --frozen --group tests --all-extras
      - name: Run coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report
          uv run coverage xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py3.12
      - name: Install dependencies
        run: uv sync --frozen --group tests --all-extras
      - name: Build distribution
        run: uv build
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: ci-python-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Smoke test wheel
        run: |
          uv venv /tmp/jam-wheel-test
          uv pip install \
            --python /tmp/jam-wheel-test/bin/python \
            dist/*.whl
          /tmp/jam-wheel-test/bin/python -c \
            "from jam import Jam; from jam.aio import AsyncJam; \
            from jam.sessions import BaseSessionModule"

  required:
    name: required
    if: always()
    needs:
      - quality
      - tests
      - coverage
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" ||
                "$TESTS_RESULT" != "success" ||
                "$COVERAGE_RESULT" != "success" ||
                "$PACKAGE_RESULT" != "success" ]]; then
            echo "One or more required CI jobs failed or were cancelled."
            exit 1
          fi
