name: Release

on:
  release:
    types: [published]

jobs:
  verify:
    name: Test and build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v3
      - name: Validate stable tag and project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a stable release tag: $RELEASE_TAG"
            exit 1
          fi

          PROJECT_VERSION="$(uv run --no-project --with tomli python -c \
            'import tomli; print(tomli.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$RELEASE_TAG" != "v$PROJECT_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match project version v$PROJECT_VERSION"
            exit 1
          fi
      - name: Install test dependencies
        run: uv sync --group tests --all-extras
      - name: Run tests
        run: uv run pytest -x
      - name: Check source quality
        run: |
          uv run ruff check src/
          uv run ruff format --check src/
          uv run pyrefly check
      - name: Build distribution
        run: uv build
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    # Environment and permissions trusted publishing.
    environment:
      # Create this environment in the GitHub repository under Settings -> Environments
      name: release
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v3
      - name: Download verified distribution
        uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist
      - run: uv publish --trusted-publishing always
