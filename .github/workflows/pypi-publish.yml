name: Release

on:
  release:
    types: [published]

jobs:
  verify:
    name: Test and build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.12"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py3.12
      - name: Validate stable tag and project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |

          PROJECT_VERSION="$(uv run --no-project --with tomli python -c \
            'import tomli; print(tomli.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$RELEASE_TAG" != "v$PROJECT_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match project version v$PROJECT_VERSION"
            exit 1
          fi
      - name: Install test dependencies
        run: uv sync --frozen --group tests --all-extras
      - name: Run tests
        run: uv run pytest -x
      - name: Build distribution
        run: uv build
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Environment and permissions trusted publishing.
    environment:
      # Create this environment in the GitHub repository under Settings -> Environments
      name: release
    permissions:
      id-token: write
    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Download verified distribution
        uses: actions/download-artifact@v4
        with:
          name: python-distribution
          path: dist
      - run: uv publish --trusted-publishing always
